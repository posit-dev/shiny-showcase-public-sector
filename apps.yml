    - org: University of Maryland Center for Environmental Science
      title: What will climate feel like in 60 years?
      url: https://fitzlab.shinyapps.io/cityapp/
      description: 'This web application helps to provide answers to these questions.
        We don’t have time machines so we can’t travel to the year 2080. However,
        we can think about places that are warmer and wetter (or drier) today than
        we where live. Perhaps you have even traveled to such a place for a holiday
        or for work and experienced that place’s weather. We can ask: If climate continues
        to change, how much will my home town feel like some warmer and wetter (or
        drier) place?'
      thumbnail: fitzlab.shinyapps.io_cityapp_.png
      order: 19.0
      tags: map, climate, science, public service
